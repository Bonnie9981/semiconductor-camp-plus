<style>

@keyframes sl{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

const EQUIP=[

 {id:"cvd",  n:"薄膜沉積機 (CVD)", cost:380, cap:3, yld:3, node:0, d:"讓氣體在晶圓表面反應，長出奈米等級的絕緣層或金屬層。"},
 {id:"imp",  n:"離子植入機",       cost:450, cap:3, yld:4, node:1, d:"把摻雜離子加速打進矽晶格，改變導電性以形成電晶體。"},
 {id:"cmp",  n:"化學機械研磨 CMP", cost:400, cap:2, yld:6, node:1, d:"邊化學腐蝕邊機械拋光，把表面磨到原子級平坦，先進製程必備。"},
 {id:"metro",n:"量測檢測機",       cost:340, cap:0, yld:9, node:1, d:"用電子束掃描找缺陷，不生產晶片，但大幅拉高良率。"},
 {id:"pack", n:"先進封裝機",       cost:460, cap:6, yld:0, node:2, d:"把多顆裸晶堆疊互連（CoWoS/HBM），是 AI 晶片的產能瓶頸。"},
 {id:"euv",  n:"EUV 曝光機",       cost:1400,cap:8, yld:7, node:2, lic:1, d:"13.5nm 極紫外光，真空中打錫滴產生電漿發光，全球唯一供應商。"}
];
const QUIZ=[
 {q:"晶圓的主要材料是什麼？",o:["矽 (Si)","銅 (Cu)","碳 (C)","鋁 (Al)"]},
 {q:"「7nm 製程」的 nm 主要代表什麼？",o:["電晶體的技術世代命名","晶圓的厚度","晶片的邊長","封裝的高度"]},
 {q:"EUV 曝光機使用的光波長約為？",o:["13.5 nm","193 nm","500 nm","1 μm"]},
 {q:"良率 (Yield) 指的是？",o:["合格晶片佔總數的比例","每小時產出片數","晶片的運算速度","設備稼動率"]},
 {q:"下列何者是「無廠半導體」(Fabless) 的模式？",o:["只設計、不自建晶圓廠","只做封裝測試","只賣設備","只生產矽晶圓"]},

 {q:"CMP 製程的目的是？",o:["把晶圓表面磨到平坦","切割晶圓","清洗光阻","加熱擴散"]},
 {q:"光阻 (Photoresist) 的作用是？",o:["感光後形成圖案遮罩","導電","散熱","黏合晶片"]},
 {q:"CoWoS 屬於哪一類技術？",o:["先進封裝","微影","蝕刻","長晶"]},
 {q:"晶圓廠無塵室等級主要控制什麼？",o:["空氣中的微粒數量","溫度","濕度","噪音"]},
 {q:"「IDM」廠商的特徵是？",o:["設計、製造、封測一手包辦","只做設計","只做代工","只賣IP"]},
 {q:"離子植入的目的是？",o:["摻雜以改變半導體導電性","增加晶圓厚度","降低溫度","去除雜質"]},
 {q:"目前主流晶圓的直徑是？",o:["12 吋 (300mm)","4 吋","20 吋","30 吋"]},
 {q:"AI 加速器對哪種記憶體需求最大？",o:["HBM 高頻寬記憶體","軟碟","光碟","磁帶"]},
 {q:"「黃光區」為什麼是黃色的？",o:["濾掉會讓光阻感光的短波長光","為了美觀","方便辨識","黃光可殺菌"]},
 {q:"光罩 (Mask) 的功能是？",o:["承載電路圖案供曝光轉印","保護作業員","過濾空氣","冷卻晶圓"]},
 {q:"下列何者不是半導體設備大廠？",o:["星巴克","ASML","應用材料 AMAT","東京威力科創 TEL"]},
 {q:"晶片「封裝」的目的不包含？",o:["提高運算時脈上限","保護晶片","散熱","對外電性連接"]},
 {q:"晶圓廠為何需要大量超純水？",o:["每道製程後都要沖洗微粒與化學殘留","用來發電","用來冷卻員工","用來稀釋矽"]},
 {q:"為什麼晶片越小效能通常越好？",o:["電子跑的距離變短、耗電更低","體積小比較好看","材料比較便宜","比較好封裝"]}
];
const EVENTS=[
 {t:"出口管制升級",d:"某大國禁止先進設備出口，中國本回合無法採購設備。",
  f:g=>{const p=g.players.find(x=>x.id==="CN");if(p){p.banUntil=g.round;log(p.name+" 被列入管制名單，本回合無法採購設備","bad");}}},
 {t:"AI 需求爆發",d:"全球資料中心搶單，本回合出貨收入 +40%。",f:g=>{g.boom=1.4;log("AI 浪潮來襲！本回合出貨收入 +40%","hi");}},
 {t:"強震侵襲",d:"晶圓廠停機檢修，本回合全體良率 -10%。",f:g=>{g.quake=10;log("強震襲擊產業聚落，本回合全體良率 -10%","bad");}},
 {t:"人才大戰",d:"設備最多的玩家被挖角，損失 200。",
  f:g=>{let p=[...g.players].sort((a,b)=>b.equip.length-a.equip.length)[0];p.money=Math.max(0,p.money-200);log(p.name+" 的資深工程師被高薪挖角，損失 200","bad");}},
 {t:"政府補貼",d:"分數最低的玩家獲得 500 補助款。",
  f:g=>{let p=[...g.players].sort((a,b)=>a.score()-b.score())[0];p.money+=500;log(p.name+" 取得國家級補貼 +500","hi");}},
 {t:"矽晶圓漲價",d:"全體支付 120 原料成本。",f:g=>{g.players.forEach(p=>p.money=Math.max(0,p.money-120));log("上游矽晶圓喊漲，全體支出 120","bad");}},
 {t:"專利訴訟",d:"製程最先進的玩家被告，賠償 300。",
  f:g=>{let p=[...g.players].sort((a,b)=>b.node-a.node)[0];p.money=Math.max(0,p.money-300);log(p.name+" 遭專利侵權訴訟，賠償 300","bad");}},
 {t:"消費電子寒冬",d:"手機需求萎縮，本回合出貨收入 -30%。",f:g=>{g.boom=0.7;log("消費性電子庫存去化，本回合收入 -30%","bad");}},
 {t:"實驗室突破",d:"隨機一國獲得 300 研究經費。",
  f:g=>{let p=g.players[Math.floor(Math.random()*g.players.length)];p.money+=300;log(p.name+" 實驗室傳出突破，獲得 300 研究經費","hi");}},
 {t:"缺水危機",d:"產能最高的玩家本回合產能 -25%。",
  f:g=>{let p=[...g.players].sort((a,b)=>b.cap()-a.cap())[0];p.drought=true;log(p.name+" 面臨限水，本回合產能 -25%","bad");}},
 {t:"設備交期延長",d:"全體本回合設備採購價 +25%。",f:g=>{g.inflate=1.25;log("設備大廠訂單滿載，本回合採購成本 +25%","bad");}},
 {t:"車用晶片荒",d:"成熟製程吃香，28nm / 14nm 玩家收入 +50%。",f:g=>{g.mature=1.5;log("車用晶片大缺貨，成熟製程收入 +50%","hi");}}
];

// ================= 引擎 =================
const ACTS=3;
let G=null;
const EQ=id=>EQUIP.find(e=>e.id===id);
const cur=()=>G.players[G.turn];
const isBanned=p=>p.banUntil>=G.round;
const $=id=>document.getElementById(id);

function mkPlayer(c,human){
 return {...c,human,money:c.money,node:0,equip:[],chips:0,deals:0,talent:0,banUntil:0,drought:false,revenue:0,
  uniq(){return [...new Set(this.equip)];},
  cap(){let b=2+this.equip.reduce((s,e)=>s+EQ(e).cap,0);if(this.drought)b*=0.75;return Math.round(b);},
  yieldRate(){
   let y=NODES[this.node].yield+this.uniq().reduce((s,e)=>s+EQ(e).yld,0)+this.talent*2+this.deals*2;
   if(this.id==="TW")y+=8;
   if(G&&G.quake)y-=G.quake;
   return Math.max(15,Math.min(92,y));
  },
  out(){return Math.round(this.cap()*this.yieldRate()/100*4);},
  parts(){return {
   資金:Math.round(this.money),
   出貨:this.chips*2,
   製程:this.node*800,
   設備:this.equip.length*60,
   外交:this.deals*200,
   人才:this.talent*150};},
  score(){return Object.values(this.parts()).reduce((a,b)=>a+b,0);}
 };
}
function log(t,c){
 const d=document.createElement("div");
 if(c)d.className=c;
 d.textContent=t;
 const L=$("log");L.insertBefore(d,L.firstChild);
}
function equipCost(p,e){
 const owned=p.equip.filter(x=>x===e.id).length;
 let c=e.cost*(1+0.45*owned)*(G.inflate||1);
 if(p.id==="CN")c*=0.8;
 return Math.round(c);
}
function rdCost(p){
 if(p.node>=NODES.length-1)return null;
 let c=NODES[p.node+1].rd;
 if(p.id==="US")c*=0.75;
 return Math.round(c);
}
function rdBlock(p){
 if(p.node>=NODES.length-1)return "已是最先進製程";
 const t=NODES[p.node+1];
 if(p.uniq().length<t.req)return `需先擁有 ${t.req} 種不同設備（目前 ${p.uniq().length} 種）`;
 if(t.needEUV&&!p.equip.includes("euv"))return "3nm 量產必須先擁有 EUV 曝光機";
 return null;
}
const dealCost=p=>250+p.deals*250;
const hireCost=p=>300+p.talent*150;

function buyEquip(p,e,disc){
 const c=Math.round(equipCost(p,e)*(disc?0.75:1));
 if(p.money<c){log("資金不足，採購失敗","bad");return false;}
 p.money-=c;p.equip.push(e.id);
 log(`${p.name} 採購 ${e.n}（-${c}）`,"hi");
 if(e.lic){const nl=G.players.find(x=>x.id==="NL");
  if(nl&&nl!==p){nl.money+=120;log("荷蘭收取曝光機授權費 +120");}}
 return true;
}
function doResearch(p){
 const b=rdBlock(p);if(b){log(b,"bad");return false;}
 const c=rdCost(p);
 if(p.money<c){log("研發經費不足","bad");return false;}
 p.money-=c;
 let prob=Math.min(.95,.75+p.equip.length*.02-(p.id==="CN"?.12:0));
 if(Math.random()<prob){p.node++;log(`${p.name} 製程升級成功 → ${NODES[p.node].n}！`,"hi");}
 else log(`${p.name} 製程試產失敗，經費付諸東流（-${c}）`,"bad");
 return true;
}
function makeDeal(p,q){
 const c=Math.max(dealCost(p),dealCost(q));
 if(p.money<c||q.money<c){log("雙方資金不足以簽約","bad");return false;}
 p.money-=c;q.money-=c;p.deals++;q.deals++;
 G.links.push([p.id,q.id]);
 log(`${p.name} 與 ${q.name} 簽訂長期供應協議（各 -${c}），雙方良率 +2%`,"hi");
 return true;
}
function hire(p){
 if(p.talent>=5){log("人才已達上限");return false;}
 const c=hireCost(p);
 if(p.money<c){log("資金不足","bad");return false;}
 p.money-=c;p.talent++;
 log(`${p.name} 挖角資深製程工程師（-${c}），良率 +2%`,"hi");
 return true;
}
const demand=()=>Math.round(150+G.round*18);
function settle(){
 const dem=demand();
 const list=G.players.map(p=>({p,y:p.yieldRate(),chips:p.out()}));
 const total=list.reduce((s,o)=>s+o.chips,0);
 const f=total>dem?dem/total:1;
 G.lastSupply=total;G.lastFactor=f;
 log(`── 第 ${G.round} 回合市況：全球需求 ${dem} 片，總供給 ${total} 片`+
     (f<1?`，供過於求！售價僅剩 ${Math.round(f*100)}%`:`，供不應求，售價滿載`),f<1?"bad":"hi");
 list.forEach(o=>{
  const p=o.p;
  let rev=o.chips*NODES[p.node].price*f*(G.boom||1);
  if(G.mature&&p.node<=1)rev*=G.mature;
  if(p.id==="TW")rev*=1.15;
  if(p.id==="KR")rev+=180;
  const up=Math.round(p.equip.reduce((s,e)=>s+EQ(e).cost,0)*0.06);
  rev=Math.round(rev);
  p.chips+=o.chips;p.money=Math.max(0,p.money+rev-up);p.revenue=rev-up;p.drought=false;
  log(`${p.name} 出貨 ${o.chips} 片（良率 ${o.y}%）收入 +${rev}，設備維護 -${up}`);
 });
 G.boom=0;G.quake=0;G.inflate=0;G.mature=0;
}

}

const LAND=[
 [[-168,65],[-140,70],[-95,72],[-60,70],[-52,47],[-70,42],[-80,25],[-97,16],[-105,20],[-125,35],[-125,50],[-140,60]],
 [[-92,17],[-83,8],[-78,10],[-60,10],[-50,0],[-35,-5],[-38,-22],[-58,-35],[-73,-52],[-75,-20],[-81,-4]],
 [[-10,44],[-9,37],[3,37],[18,40],[28,41],[30,45],[40,48],[42,60],[30,70],[22,70],[10,58],[3,53],[-5,50]],
 [[-17,15],[-5,5],[10,4],[12,-6],[13,-17],[18,-35],[28,-33],[33,-25],[40,-15],[43,-2],[51,12],[43,12],[35,22],[32,31],[10,33],[-6,36],[-17,21]],
 [[30,45],[45,40],[52,28],[60,25],[68,25],[73,8],[80,10],[90,22],[98,13],[105,10],[110,20],[122,32],[127,40],[135,45],[142,45],[140,55],[160,60],[178,64],[178,71],[140,75],[100,78],[60,72],[40,68],[35,55]],
 [[113,-22],[129,-11],[142,-11],[153,-25],[150,-38],[135,-35],[115,-34]],
 [[130,32],[140,36],[145,44],[141,45],[133,34]],
 [[-45,60],[-20,70],[-20,82],[-50,83],[-58,70]],
 [[166,-46],[174,-34],[178,-38],[170,-47]]
];
const MW=1200,MH=500,LAT0=78,LAT1=-58;
const px=lon=>(lon+180)/360*MW, py=lat=>(LAT0-lat)/(LAT0-LAT1)*MH;
function inPoly(x,y,poly){
 let c=false;
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const a=poly[i],b=poly[j];
  if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;
 }
 return c;
}
let DOTS=[];
function buildDots(){
 DOTS=[];
 for(let lat=LAT0;lat>LAT1;lat-=2.9)
  for(let lon=-180;lon<180;lon+=2.3)
   if(LAND.some(p=>inPoly(lon,lat,p)))DOTS.push([px(lon),py(lat),lon,lat]);
}
buildDots();
if(typeof CanvasRenderingContext2D!=="undefined"&&!CanvasRenderingContext2D.prototype.roundRect){
 CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
  this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
  this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
let mapT=0,mapRAF=null;
function drawMap(){
 const cv=$("map");if(!cv)return;
 const x=cv.getContext("2d");
 mapT+=0.016;
 x.clearRect(0,0,MW,MH);
 // 星空底
 x.fillStyle="#060c16";x.fillRect(0,0,MW,MH);
 for(let i=0;i<60;i++){
  const sx=(i*137)%MW,sy=(i*71)%MH,a=.12+.12*Math.sin(mapT*1.4+i);
  x.fillStyle=`rgba(120,170,255,${a})`;x.fillRect(sx,sy,1.6,1.6);
 }
 const P=G?G.players:[];
 // 陸地點陣
 DOTS.forEach((d,i)=>{
  let col="#1e3a5f",r=1.7;
  let best=null,bd=1e9;
  P.forEach(p=>{const dx=d[0]-px(p.lon),dy=d[1]-py(p.lat),dist=Math.hypot(dx,dy);
   if(dist<bd){bd=dist;best=p;}});
  if(best&&bd<58+best.equip.length*3.2){
   col=best.color;
   r=1.9+0.7*Math.sin(mapT*2.2-bd*0.05);
   x.globalAlpha=.35+.45*(1-bd/(58+best.equip.length*3.2));
  }else x.globalAlpha=.55;
  x.fillStyle=col;
  x.beginPath();x.arc(d[0],d[1],r,0,7);x.fill();
  x.globalAlpha=1;
 });
 if(!G)return;
 // 貿易連線
 G.links.forEach((L,i)=>{
  const a=G.players.find(p=>p.id===L[0]),b=G.players.find(p=>p.id===L[1]);
  if(!a||!b)return;
  const x1=px(a.lon),y1=py(a.lat),x2=px(b.lon),y2=py(b.lat);
  const mx=(x1+x2)/2,my=(y1+y2)/2-Math.abs(x2-x1)*0.22;
  x.strokeStyle="#4de2c055";x.lineWidth=1.4;
  x.beginPath();x.moveTo(x1,y1);x.quadraticCurveTo(mx,my,x2,y2);x.stroke();
  const t=(mapT*0.28+i*0.33)%1, u=1-t;
  const cx=u*u*x1+2*u*t*mx+t*t*x2, cy=u*u*y1+2*u*t*my+t*t*y2;
  x.fillStyle="#4de2c0";x.beginPath();x.arc(cx,cy,3,0,7);x.fill();
 });
 // 國家節點
 const OFF={US:[0,-52],TW:[92,46],KR:[86,-14],CN:[-56,-30],NL:[-40,-52]};
 G.players.forEach((p,i)=>{
  const cx=px(p.lon),cy=py(p.lat),act=(i===G.turn&&!G.over);
  const pulse=1+0.18*Math.sin(mapT*3+i);
  x.save();
  // 光暈
  const gr=x.createRadialGradient(cx,cy,0,cx,cy,42*pulse);
  gr.addColorStop(0,p.color+"66");gr.addColorStop(1,p.color+"00");
  x.fillStyle=gr;x.beginPath();x.arc(cx,cy,42*pulse,0,7);x.fill();
  // 擴散環
  const rr=((mapT*38+i*22)%60);
  x.strokeStyle=p.color+Math.max(0,Math.round((1-rr/60)*180)).toString(16).padStart(2,"0");
  x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,10+rr*.6,0,7);x.stroke();
  // 主體
  x.fillStyle=p.color;x.beginPath();x.arc(cx,cy,act?9:6.5,0,7);x.fill();
  x.strokeStyle="#04070d";x.lineWidth=2;x.stroke();
  if(act){x.strokeStyle=p.color;x.lineWidth=2;
   x.beginPath();x.arc(cx,cy,15,mapT*2.2,mapT*2.2+2.1);x.stroke();
   x.beginPath();x.arc(cx,cy,15,mapT*2.2+3.14,mapT*2.2+5.24);x.stroke();}
  // 標籤
  const o=OFF[p.id]||[0,-46], lx=cx+o[0], ly=cy+o[1];
  x.strokeStyle=p.color+"77";x.lineWidth=1;
  x.beginPath();x.moveTo(cx,cy);x.lineTo(lx,ly+14);x.stroke();
  const w=138,h=44;
  x.fillStyle="rgba(8,16,30,.9)";x.strokeStyle=act?p.color:p.color+"55";x.lineWidth=act?2:1;
  x.beginPath();x.roundRect(lx-w/2,ly-h/2,w,h,8);x.fill();x.stroke();
  x.textAlign="left";
  x.fillStyle=p.color;x.font="bold 14px sans-serif";
  x.fillText(p.name,lx-w/2+9,ly-8);
  x.fillStyle="#7f93b5";x.font="9px sans-serif";
  x.fillText(p.human?"PLAYER":"AI",lx+w/2-38,ly-9);
  x.fillStyle="#ffd166";x.font="bold 12px sans-serif";
  x.fillText("$"+p.money,lx-w/2+9,ly+9);
  x.fillStyle="#9fb2d0";x.font="11px sans-serif";
  x.fillText(NODES[p.node].n+" · "+p.equip.length+"台",lx-w/2+62,ly+9);
  // 產能長條
  x.fillStyle="#16233a";x.fillRect(lx-w/2+9,ly+13,w-18,3);
  x.fillStyle=p.color;x.fillRect(lx-w/2+9,ly+13,(w-18)*Math.min(1,p.cap()/45),3);
  x.restore();
 });
 // 標題浮水印
 x.fillStyle="#4de2c022";x.font="bold 40px sans-serif";x.textAlign="left";
 x.fillText("SEMICONDUCTOR WORLD MAP",24,MH-24);
}

let demoRAF=null,demoT=0;
function stopDemo(){if(demoRAF)cancelAnimationFrame(demoRAF);demoRAF=null;}
function startDemo(id){
 stopDemo();demoT=0;
 const cv=$("cv");if(!cv)return;
 const x=cv.getContext("2d");
 (function loop(){demoT+=0.011;if(demoT>1)demoT=0;paint(x,id,demoT);demoRAF=requestAnimationFrame(loop);})();
}
function paint(x,id,t){
 x.clearRect(0,0,480,220);x.fillStyle="#050a12";x.fillRect(0,0,480,220);
 x.lineWidth=2;x.textAlign="center";
 const W=(f,tx,cx,cy,s)=>{x.fillStyle=f;x.font=(s||11)+"px sans-serif";x.fillText(tx,cx,cy);};
 if(id==="cz"){
  x.strokeStyle="#8fa6c8";x.strokeRect(180,140,120,55);
  const g=x.createLinearGradient(0,150,0,193);g.addColorStop(0,"#ffca6b");g.addColorStop(1,"#ff6b2c");
  x.fillStyle=g;x.fillRect(182,150,116,43);
  for(let i=0;i<9;i++){x.fillStyle="rgba(255,200,120,.5)";
   x.beginPath();x.arc(190+i*13,188-((t*40+i*9)%36),2,0,7);x.fill();}
  const h=105*t;
  x.fillStyle="#e3e9f5";x.beginPath();x.moveTo(230,150-h);x.lineTo(250,150-h);x.lineTo(248,150);x.lineTo(232,150);x.fill();

 }else if(id==="litho"||id==="euv"){
  const gl=id==="euv",col=gl?"#b48cff":"#f7e26b";
  x.fillStyle=col;x.globalAlpha=.18+.08*Math.sin(t*20);
  x.beginPath();x.moveTo(206,18);x.lineTo(274,18);x.lineTo(304,120);x.lineTo(176,120);x.closePath();x.fill();x.globalAlpha=1;
  x.fillStyle="#8fa6c8";x.fillRect(188,58,104,9);
  for(let i=0;i<5;i++){x.fillStyle="#050a12";x.fillRect(194+i*20,58,9,9);}
  W("#7f93b5","光罩 Mask",240,50);
  x.fillStyle="#16233a";x.fillRect(158,125,164,18);
  const n=Math.floor(t*5)+1;
  for(let i=0;i<n;i++){x.fillStyle=col;x.fillRect(174+i*28,127,13,14);}

 }else if(id==="etch"){
  x.fillStyle="#16233a";x.fillRect(120,110,240,52);
  x.fillStyle="#2b4269";x.fillRect(120,90,240,20);
  for(let i=0;i<6;i++)if(i%2===0){x.fillStyle="#4de2c0";x.fillRect(126+i*40,78,28,11);}
  const d=20*t;
  for(let i=0;i<6;i++)if(i%2===1){x.fillStyle="#050a12";x.fillRect(126+i*40,90,28,Math.min(20,d));}
  for(let i=0;i<16;i++){const pxx=126+((i*37+t*320)%228),pyy=18+((i*23+t*260)%58);
   x.fillStyle="#b48cff";x.fillRect(pxx,pyy,2,7);}
  W("#b48cff","電漿離子高速轟擊",240,16);W("#7f93b5","沒被光阻保護的區域被一層層轟掉",240,190);
 }else if(id==="cvd"){
  x.fillStyle="#16233a";x.fillRect(120,140,240,32);
  const g=x.createLinearGradient(0,110,0,140);g.addColorStop(0,"#4de2c0");g.addColorStop(1,"#1f7a68");
  x.fillStyle=g;x.fillRect(120,140-30*t,240,30*t);
  for(let i=0;i<20;i++){const pxx=124+((i*61)%232),pyy=(((i*41)+t*280)%112);
   x.fillStyle="rgba(143,166,200,.85)";x.beginPath();x.arc(pxx,18+pyy,3,0,7);x.fill();}
  W("#8fa6c8","前驅氣體分子注入",240,15);W("#7f93b5","在晶圓表面反應，長出奈米等級薄膜",240,196);
 }else if(id==="imp"){
  x.fillStyle="#16233a";x.fillRect(120,118,240,62);
  for(let r=0;r<3;r++)for(let c=0;c<12;c++){x.fillStyle="#2b4269";x.beginPath();x.arc(132+c*20,132+r*18,4,0,7);x.fill();}
  for(let i=0;i<6;i++){const pyy=18+((t*170+i*30)%98);
   x.strokeStyle="#ffd166";x.beginPath();x.moveTo(140+i*40,pyy);x.lineTo(140+i*40,pyy+15);x.stroke();}
  const k=Math.floor(t*10);

 }else if(id==="cmp"){

   x.beginPath();x.arc(110+((i*47+t*260)%260),124,2,0,7);x.fill();}

 }else if(id==="metro"){

  x.fillStyle=g;x.fillRect(160,sy-14,160,14);

   x.fillStyle="#ff7a7a";x.beginPath();x.arc(d[0],d[1],5,0,7);x.fill();
   x.strokeStyle="#ff7a7a55";x.beginPath();x.arc(d[0],d[1],10,0,7);x.stroke();}});
  W("#4de2c0","電子束掃描中…",240,22);W("#7f93b5","找出缺陷並回饋製程 → 良率大幅提升",240,208);
 }else if(id==="pack"){
  const n=Math.min(3,Math.floor(t*4)+1);
  x.fillStyle="#16233a";x.fillRect(130,162,220,18);
  W("#7f93b5","基板 Substrate",240,196);
  for(let i=0;i<n;i++){
   const col=["#4de2c0","#ffd166","#b48cff"][i];
   x.fillStyle=col;x.fillRect(146+i*70,122,62,38);
   W("#050a12",["邏輯裸晶","HBM","HBM"][i],177+i*70,145,10);
   x.strokeStyle="#8fa6c8";
   for(let j=0;j<3;j++){x.beginPath();x.moveTo(160+i*70+j*15,160);x.lineTo(160+i*70+j*15,162);x.stroke();}
  }
  x.strokeStyle="#4de2c0"+(Math.sin(t*14)>0?"cc":"44");
  x.beginPath();x.moveTo(208,140);x.lineTo(216,140);x.moveTo(278,140);x.lineTo(286,140);x.stroke();
  W("#4de2c0","多顆裸晶並排堆疊、以矽中介層互連（CoWoS）",240,38);
 }
}

// ================= 流程 =================
function spend(){G.acts--;if(G.acts<=0)setTimeout(endTurn,300);}
function endTurn(){
 if(G.over)return;
 closeM();
 G.turn++;
 if(G.turn>=G.players.length){
  G.turn=0;
  settle();
  if(G.round>=G.maxR){finish();return;}
  G.round++;
  const ev=drawEvent();
  const rank=[...G.players].sort((a,b)=>b.score()-a.score());
  openM(`<h2>第 ${G.round-1} 回合結算</h2>
   <div class="item" style="display:block;border-color:#ffd166">
    <b style="color:#ffd166">產業新聞：${ev.t}</b><div class="d">${ev.d}</div></div>
   <div class="mid">${rank.map((p,i)=>
    `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #131f33;padding:4px 0">
      <span><b style="color:${p.color}">${i+1}. ${p.name}</b>　${NODES[p.node].n}</span>
      <span>出貨 ${p.chips} 片　收入 <span class="money">+${p.revenue}</span>　分 <b>${p.score()}</b></span></div>`).join("")}</div>

}
function afterEvt(){G.acts=ACTS;render();if(!cur().human)setTimeout(aiPlay,650);}

// ================= 結算畫面 =================
function finish(){
 G.over=true;
 const rank=[...G.players].sort((a,b)=>b.score()-a.score());
 const top=rank[0],max=top.score();
 const keys=["資金","出貨","製程","設備","外交","人才"];
 const mvp=[
  ["最會賺錢",[...G.players].sort((a,b)=>b.money-a.money)[0],p=>"$"+p.money],
  ["出貨之王",[...G.players].sort((a,b)=>b.chips-a.chips)[0],p=>p.chips+" 片"],
  ["技術先鋒",[...G.players].sort((a,b)=>b.node-a.node)[0],p=>NODES[p.node].n],
  ["良率之神",[...G.players].sort((a,b)=>b.yieldRate()-a.yieldRate())[0],p=>p.yieldRate()+"%"],
  ["設備狂人",[...G.players].sort((a,b)=>b.equip.length-a.equip.length)[0],p=>p.equip.length+" 台"],
  ["外交高手",[...G.players].sort((a,b)=>b.deals-a.deals)[0],p=>p.deals+" 份"]
 ];
 openM(`<h2>FINAL RESULT　最終戰報</h2>
  <div class="big" style="color:${top.color}">🏆 ${top.name} 勝出</div>
  <div class="mvp">${top.flag}　│　總分 ${max}　│　歷經 ${G.maxR} 回合</div>
  ${rank.map((p,i)=>`
   <div class="rank g${i+1}" style="animation-delay:${i*.12}s">
    <div class="no">${i+1}</div>
    <div class="bd">
     <div class="bn" style="color:${p.color}">${p.name} <span style="color:#5d7396;font-size:11px">${p.human?'PLAYER':'AI'}　${p.flag}</span>
      <span style="float:right;color:#ffd166">${p.score()} 分</span></div>
     <div class="bs">${NODES[p.node].n}　設備 ${p.equip.length} 台　良率 ${p.yieldRate()}%　累計出貨 ${p.chips} 片　協議 ${p.deals} 份　資金 $${p.money}</div>
     <div class="bar2"><i data-w="${Math.round(p.score()/max*100)}"></i></div>
     <div class="bs" style="color:#5d7396">${keys.map(k=>k+" "+p.parts()[k]).join("　")}</div>
    </div></div>`).join("")}
  <hr><b style="color:#4de2c0;font-size:12px;letter-spacing:2px">單項榮譽</b><br>
  <div class="mid">${mvp.map(m=>`<span class="tag go">${m[0]}：${m[1].name}（${m[2](m[1])}）</span>`).join("")}</div>
  <hr>
  <div class="mid" style="color:#7f93b5">分數 = 資金 + 累計出貨×2 + 製程等級×800 + 設備×60 + 協議×200 + 人才×150<br>
  想贏，就得在「衝製程、擴產能、結盟、拚良率」之間找到自己的平衡點。</div><br>
  <button class="pri" onclick="setup()">再玩一次</button>`,true);
 setTimeout(()=>document.querySelectorAll(".bar2 i").forEach(b=>b.style.width=b.dataset.w+"%"),120);
 render();
}

// ================= AI =================
function aiPlay(){
 if(!G||G.over)return;
 const p=cur();
 if(p.human){render();return;}
 let acted=false;
 const c=rdCost(p), saving=(c!==null&&!rdBlock(p));
 if(saving&&p.money>=c)acted=doResearch(p);
 if(!acted&&!isBanned(p)){
  const reserve=saving?c*0.6:0;
  const opts=EQUIP.filter(e=>p.node>=e.node&&p.money-equipCost(p,e)>=reserve)
   .sort((a,b)=>(b.cap*8+b.yld*12)/equipCost(p,b)-(a.cap*8+a.yld*12)/equipCost(p,a));
  if(opts.length){
   const ok=Math.random()<0.6;
   log(`${p.name} 技術團隊${ok?"答對":"答錯"}審查題`);
   acted=buyEquip(p,opts[0],ok);
  }
 }
 if(!acted&&p.money>hireCost(p)+500&&p.talent<5)acted=hire(p);
 if(!acted&&p.deals<2){
  const c2=dealCost(p);
  const q=G.players.filter(x=>x!==p&&!x.human&&Math.max(c2,dealCost(x))<=x.money)[0];
  if(q&&p.money>=Math.max(c2,dealCost(q)))acted=makeDeal(p,q);
 }
 G.acts--;render();
 if(G.acts>0)setTimeout(aiPlay,550);else setTimeout(endTurn,550);
}

function rules(){
 openM(`<h2>遊戲規則</h2><div class="mid">
 <b style="color:#4de2c0">流程</b>　共 N 回合（開場自選），每回合每位玩家有 <b>3 個行動</b>。全員行動完畢後進行產能結算，接著抽一張<b>產業新聞卡</b>影響下一回合。<br><br>
 <b style="color:#4de2c0">四種行動</b><br>
 ・<b>採購設備</b>　增加產能與良率；買之前會播原理動畫，答對技術題可打 75 折。同型設備重複購買價格 +45%。<br>
 ・<b>製程研發</b>　28nm → 14nm → 7nm → 3nm。單價變高但基礎良率大跌，需要更多設備補回，且有失敗機率。<br>
 ・<b>外交簽約</b>　雙方各付費用，永久 +2% 良率並累積協議分。<br>
 ・<b>挖角人才</b>　每位 +2% 良率，最多 5 位，越挖越貴。<br><br>
 <b style="color:#4de2c0">收入公式</b><br>
 出貨片數 = 產能 × 良率 × 4　│　收入 = 出貨片數 × 製程單價<br><br>
 <b style="color:#4de2c0">勝負</b><br>
 所有回合結束後，<b>總分最高者獲勝</b>。<br>
 分數 = 資金 + 累計出貨×2 + 製程等級×800 + 設備×60 + 協議×200 + 人才×150<br><br>
 <b style="color:#4de2c0">設計理念</b><br>
 先進製程不是「花錢就變強」：單價上升的同時良率崩跌，必須用整條設備鏈把良率救回來——這正是真實半導體產業最核心的挑戰。
 </div><br><button class="gho" onclick="closeM()">關閉</button>`);
}

function setR(r){SEL.r=r;[...document.querySelectorAll("#rsel button")].forEach(b=>
 b.classList.toggle("on",b.textContent===r+" 回合"));}
function tog(i){SEL.h[i]=!SEL.h[i];const b=$("s"+i);b.textContent=SEL.h[i]?"玩家":"AI";b.classList.toggle("on",SEL.h[i]);}
function start(){
 G={round:1,turn:0,acts:ACTS,maxR:SEL.r,boom:0,quake:0,inflate:0,mature:0,over:false,links:[],
    players:COUNTRIES.map((c,i)=>mkPlayer(c,SEL.h[i]))};
 closeM();
 $("log").innerHTML="";
 log(`遊戲開始：五國進入 ${G.maxR} 回合的晶片軍備競賽`,"hi");

}
mapLoop();
setup();
