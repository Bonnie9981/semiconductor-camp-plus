name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 讓 GITHUB_TOKEN 有發佈 Pages 的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一次部署，但不取消進行中的（避免發佈到一半被打斷）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
